<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlassTube</title>
    <style>
        :root {
            --bg-color: #050505;
            --bg-card: #121212;
            --bg-brilloso: #1e1e1e;
            --neon-pink: #ff007f;
            --neon-pink-glow: rgba(255, 0, 127, 0.4);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-family); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* LOADER */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
        .spinner { width: 60px; height: 60px; border: 4px solid var(--bg-brilloso); border-top: 4px solid var(--neon-pink); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-pink-glow); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-screen p { margin-top: 20px; color: var(--neon-pink); font-weight: bold; letter-spacing: 2px; }

        /* VISTAS */
        .view { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 160px; display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.5rem; margin-bottom: 15px; margin-top: 10px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 20px; }
        .section-header h2 { margin: 0; }
        
        .song-list { display: flex; flex-direction: column; gap: 15px; }
        .song-card { display: flex; align-items: center; background-color: var(--bg-card); padding: 10px; border-radius: 12px; transition: all 0.3s ease; cursor: pointer; border: 1px solid transparent; position: relative; }
        .song-card:hover { background-color: var(--bg-brilloso); box-shadow: 0 0 10px var(--neon-pink-glow); border: 1px solid var(--neon-pink); }
        
        .song-cover { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; background: linear-gradient(135deg, var(--neon-pink), #2a003f); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 0 10px var(--neon-pink-glow); flex-shrink: 0; }
        
        .song-info { flex: 1; overflow: hidden; min-width: 0; /* Necesario para que el ellipsis funcione */ }
        .song-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* INDICADOR DE LIKE EN LA LISTA */
        .like-indicator { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--neon-pink); display: none; }
        .like-indicator svg { width: 20px; height: 20px; fill: currentColor; filter: drop-shadow(0 0 5px var(--neon-pink)); }
        .song-card.liked .like-indicator { display: block; }

        /* MINI REPRODUCTOR */
        #mini-player { position: fixed; bottom: 70px; left: 10px; right: 10px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); border-radius: 15px; padding: 10px 15px; display: none; align-items: center; border: 1px solid var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink-glow); z-index: 100; cursor: pointer; }
        #mini-player.active { display: flex; }
        .player-cover { width: 40px; height: 40px; border-radius: 5px; margin-right: 10px; background: linear-gradient(135deg, var(--neon-pink), #2a003f); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .player-controls { flex: 1; overflow: hidden; }
        .playing-title { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--neon-pink); }
        .playing-artist { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* BOTONES SVG */
        .play-btn { background: var(--neon-pink); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--neon-pink-glow); flex-shrink: 0; }
        .play-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* MENÚ INFERIOR */
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background-color: var(--bg-card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--bg-brilloso); z-index: 101; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; cursor: pointer; transition: color 0.3s; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--neon-pink); filter: drop-shadow(0 0 5px var(--neon-pink-glow)); }

        /* PANTALLA COMPLETA (MODAL) */
        #full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #1a1a1a, var(--bg-color)); z-index: 200; display: flex; flex-direction: column; padding: 30px 20px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        #full-player.active { transform: translateY(0); }
        
        .close-btn { background: none; border: none; color: white; cursor: pointer; align-self: flex-start; margin-bottom: 20px; }
        .close-btn svg { width: 30px; height: 30px; fill: currentColor; }
        
        .full-cover-container { width: 100%; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--neon-pink-glow); margin-bottom: 30px; position: relative; }
        .full-cover { width: 100%; height: 100%; background: linear-gradient(135deg, var(--neon-pink), #2a003f); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; font-size: 5rem; }
        
        .full-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .full-texts { flex: 1; overflow: hidden; padding-right: 15px; min-width: 0; }
        .full-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .full-artist { font-size: 1rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .credits { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; opacity: 0.7; }
        
        /* BOTONES LIKE / DISLIKE (Ahora con SVG) */
        .feedback-btns { display: flex; gap: 15px; }
        .feedback-btn { background: transparent; border: 2px solid var(--bg-brilloso); color: var(--text-muted); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s; }
        .feedback-btn svg { width: 22px; height: 22px; fill: currentColor; }
        
        /* Brillo del like */
        .feedback-btn.active-like { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink), inset 0 0 10px var(--neon-pink-glow); animation: pulseGlow 1.5s infinite alternate; }
        .feedback-btn.active-dislike { border-color: #555; color: #888; background: #222; }
        
        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px var(--neon-pink), inset 0 0 5px var(--neon-pink-glow); }
            to { box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px var(--neon-pink-glow); }
        }

        /* BARRA DE PROGRESO */
        .progress-container { width: 100%; margin-bottom: 20px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: var(--bg-brilloso); border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--neon-pink); cursor: pointer; -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 10px var(--neon-pink-glow); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

        /* CONTROLES PRINCIPALES */
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 30px; }
        .ctrl-btn { background: none; border: none; color: white; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn svg { width: 35px; height: 35px; fill: currentColor; }
        .ctrl-btn:hover { color: var(--neon-pink); }
        .play-large { background: white; color: black; width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(255,255,255,0.2); cursor: pointer; border: none; }
        .play-large svg { width: 35px; height: 35px; fill: currentColor; }
        .play-large:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>CARGANDO PLASSTUBE...</p>
    </div>

    <!-- VISTA HOME -->
    <div id="view-home" class="view active">
        <h2>Bienvenido a PlassTube</h2>
        
        <!-- CAMBIO: Sección de Recomendados (últimas escuchadas) -->
        <div class="section-header">
            <h2>Recomendados</h2>
        </div>
        <div class="song-list" id="home-recommended"></div>

        <!-- CAMBIO: Sección de Favoritos -->
        <div class="section-header">
            <h2>Favoritos</h2>
        </div>
        <div class="song-list" id="home-favorites"></div>

        <!-- Playlist general -->
        <div class="section-header">
            <h2>Tu Playlist</h2>
        </div>
        <div class="song-list" id="home-list"></div>
    </div>

    <div id="view-search" class="view">
        <h2>Buscar en tu Playlist</h2>
        <div class="search-bar" style="display: flex; background: var(--bg-brilloso); border-radius: 25px; padding: 10px 20px; margin-bottom: 20px; border: 1px solid var(--neon-pink);">
            <input type="text" id="search-input" placeholder="Filtrar por canción o artista..." style="flex: 1; background: none; border: none; color: white; font-size: 1rem; outline: none;">
            <button id="search-btn" style="background: none; border: none; color: var(--neon-pink); font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>
        <div class="song-list" id="search-results"></div>
    </div>

    <div id="view-settings" class="view">
        <h2>Configuración</h2>
        <div class="settings-container" style="background: var(--bg-card); border-radius: 15px; padding: 20px; border-left: 4px solid var(--neon-pink); box-shadow: -5px 0 15px var(--neon-pink-glow);">
            <div class="setting-item" style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--bg-brilloso);"><span>Canciones escuchadas</span><span class="setting-value" id="stat-played" style="color: var(--neon-pink); font-weight: bold;">0</span></div>
            <div class="setting-item" style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--bg-brilloso);"><span>Almacenamiento en caché</span><span class="setting-value" id="stat-cache" style="color: var(--neon-pink); font-weight: bold;">0 KB</span></div>
            <div class="setting-item" style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: none;"><span>Versión</span><span class="setting-value" style="color: var(--neon-pink); font-weight: bold;">1.3.0 PlassTube</span></div>
        </div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top: 20px; background: transparent; color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer;">Borrar historial</button>
    </div>

    <!-- MINI REPRODUCTOR -->
    <div id="mini-player" onclick="abrirPantallaCompleta()">
        <div class="player-cover" id="mini-cover">🎵</div>
        <div class="player-controls">
            <div class="playing-title" id="mini-title">Canción</div>
            <div class="playing-artist" id="mini-artist">Artista</div>
        </div>
        <button class="play-btn" id="mini-play-btn" onclick="event.stopPropagation(); togglePlay()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
    </div>
    
    <!-- ELEMENTO DE AUDIO OCULTO -->
    <audio id="audio-element"></audio>

    <!-- PANTALLA COMPLETA (MODAL) -->
    <div id="full-player">
        <button class="close-btn" onclick="cerrarPantallaCompleta()">
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>
        
        <div class="full-cover-container">
            <div class="full-cover" id="full-cover">🎵</div>
        </div>

        <div class="full-info">
            <div class="full-texts">
                <div class="full-title" id="full-title">Título</div>
                <div class="full-artist" id="full-artist">Artista</div>
                <div class="credits">© Placencio Corporation</div>
            </div>
            <div class="feedback-btns">
                <!-- CAMBIO: Botones SVG para Like/Dislike -->
                <button class="feedback-btn" id="btn-dislike" onclick="votar('dislike')">
                    <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
                </button>
                <button class="feedback-btn" id="btn-like" onclick="votar('like')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="main-controls">
            <button class="ctrl-btn" onclick="anteriorCancion()">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="play-large" id="full-play-btn" onclick="togglePlay()">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" onclick="siguienteCancion()">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
        
        <!-- CAMBIO: Se eliminaron los 3 botones (span) que estaban aquí abajo -->
    </div>

    <div id="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Inicio
        </div>
        <div class="nav-item" onclick="switchTab('search')">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Buscar
        </div>
        <div class="nav-item" onclick="switchTab('settings')">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg> Ajustes
        </div>
    </div>

    <script>
        // --- PLAYLIST COMPLETA ---
        let playlist = [
            { id: 1, name: "Latin Lover", artist: "Neutro Shorty, Big Soto", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936364197.mpeg", cover: "" },
            { id: 2, name: "El La Engaño Lambada", artist: "Natusha", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936787983.mpeg", cover: "" },
            { id: 3, name: "Quédate", artist: "Belee", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936643238.mpeg", cover: "" },
            { id: 4, name: "Odisea", artist: "Ozuna", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775935979163.mpeg", cover: "" },
            { id: 5, name: "Maquiavélico", artist: "Cancerbero", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936827892.mpeg", cover: "" },
            { id: 6, name: "Eoo", artist: "Bad Bunny", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936322243.mpeg", cover: "" },
            { id: 7, name: "Los Viejos Me Llaman", artist: "No Name", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936897844.mpeg", cover: "" },
            { id: 8, name: "Ninfómana", artist: "Jossimar ft El Apóstol", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936920447.mpeg", cover: "" },
            { id: 9, name: "Eu Já Sofri Por Amor Mas Não Sofro Mais", artist: "TikTokTunes (Brasil)", url: "https://d.uguu.se/FjTEHYFP.mp3", cover: "" },
            { id: 10, name: "Kamin", artist: "EMIN, JONY", url: "https://n.uguu.se/JSbiiAsL.mp3", cover: "" },
            { id: 11, name: "No Me Vendo", artist: "RDjavi", url: "https://d.uguu.se/fXbMgFAh.mp3", cover: "" }
        ];

        // --- ESTADO GLOBAL ---
        const audio = document.getElementById('audio-element');
        let currentSongIndex = -1;
        let isPlaying = false;
        
        let savedOrder = JSON.parse(localStorage.getItem('neon_order')) || [];
        let userVotes = JSON.parse(localStorage.getItem('neon_votes')) || {};
        let playHistory = JSON.parse(localStorage.getItem('neon_history')) || []; // CAMBIO: Para recomendados

        if (savedOrder.length > 0) {
            playlist.sort((a, b) => {
                let indexA = savedOrder.indexOf(a.id);
                let indexB = savedOrder.indexOf(b.id);
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });
        }

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            actualizarEstadisticas();
            renderizarHome();
            renderizarLista(playlist, 'home-list');

            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            }, 1000); 
        };

        // --- NAVEGACIÓN PESTAÑAS ---
        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`view-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tab === 'settings') actualizarEstadisticas();
            if(tab === 'search') {
                document.getElementById('search-input').value = '';
                renderizarLista(playlist, 'search-results');
            }
        }

        // --- CAMBIO: RENDERIZADO DINÁMICO DEL HOME ---
        function renderizarHome() {
            // Filtrar Recomendados (últimas escuchadas)
            let recomendados = [];
            if (playHistory.length > 0) {
                // Obtenemos las ultimas 5 canciones del historial sin repetir
                const uniqueIds = [...new Set(playHistory)].slice(0, 5);
                recomendados = uniqueIds.map(id => playlist.find(c => c.id === id)).filter(Boolean);
            } else {
                // Si no hay historial, mostrar las primeras 3 por defecto
                recomendados = playlist.slice(0, 3);
            }
            renderizarLista(recomendados, 'home-recommended');

            // Filtrar Favoritos (los que tienen 'like')
            const favoritos = playlist.filter(c => userVotes[c.id] === 'like');
            renderizarLista(favoritos, 'home-favorites');
            
            // Si no hay favoritos, mostramos un mensaje (opcional)
            if (favoritos.length === 0) {
                document.getElementById('home-favorites').innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; padding: 10px;">Dale like a tus canciones para verlas aquí.</p>';
            }
        }

        // --- RENDERIZAR LISTA (Ajustado) ---
        function renderizarLista(lista, contenedorId) {
            const container = document.getElementById(contenedorId);
            if (!container) return;
            container.innerHTML = '';

            if (lista.length === 0) return; // Si está vacío, no renderizar nada

            lista.forEach((cancion) => {
                const div = document.createElement('div');
                div.className = 'song-card';
                
                if (userVotes[cancion.id] === 'like') div.classList.add('liked');
                
                div.onclick = () => {
                    abrirPantallaCompleta();
                    reproducirPorId(cancion.id);
                };
                
                const coverStyle = cancion.cover ? `background-image: url('${cancion.cover}');` : '';
                const coverContent = cancion.cover ? '' : '🎵';

                div.innerHTML = `
                    <div class="song-cover" style="${coverStyle}">${coverContent}</div>
                    <div class="song-info">
                        <div class="song-title">${cancion.name}</div>
                        <div class="song-artist">${cancion.artist}</div>
                    </div>
                    <div class="like-indicator">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- BUSCADOR ---
        document.getElementById('search-input')?.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtradas = playlist.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.artist.toLowerCase().includes(query)
            );
            renderizarLista(filtradas, 'search-results');
        });

        // --- LÓGICA DE REPRODUCCIÓN ---
        function reproducirPorId(id) {
            const index = playlist.findIndex(c => c.id === id);
            if (index !== -1) reproducirCancion(index);
        }

        function reproducirCancion(index) {
            if (index < 0 || index >= playlist.length) return;
            
            currentSongIndex = index;
            const cancion = playlist[index];
            
            // CAMBIO: Arreglo del bug del minuto final. Reseteamos el tiempo a 0.
            audio.currentTime = 0; 

            document.getElementById('mini-player').classList.add('active');
            document.getElementById('mini-title').innerText = cancion.name;
            document.getElementById('mini-artist').innerText = cancion.artist;
            
            document.getElementById('full-title').innerText = cancion.name;
            document.getElementById('full-artist').innerText = cancion.artist;
            
            const coverStyle = cancion.cover ? `background-image: url('${cancion.cover}');` : '';
            const coverContent = cancion.cover ? '' : '🎵';
            
            const miniCover = document.getElementById('mini-cover');
            miniCover.style.cssText = coverStyle;
            miniCover.innerHTML = coverContent;

            const fullCover = document.getElementById('full-cover');
            fullCover.style.cssText = coverStyle;
            fullCover.innerHTML = coverContent;

            audio.src = cancion.url;
            audio.play().then(() => {
                isPlaying = true;
                actualizarBotonesPlay();
                guardarEstadisticaPlay(cancion.id); // CAMBIO: Guardamos ID para recomendados
            }).catch(err => {
                console.error("Error al reproducir", err);
                isPlaying = false;
                actualizarBotonesPlay();
            });

            actualizarBotonesVoto(cancion.id);
        }

        function togglePlay() {
            if (currentSongIndex === -1) return; 
            
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
            isPlaying = !isPlaying;
            actualizarBotonesPlay();
        }

        // CAMBIO: Actualizar botones con SVG (Play/Pausa)
        function actualizarBotonesPlay() {
            const svgPlay = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            const svgPause = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            const icon = isPlaying ? svgPause : svgPlay;
            
            document.getElementById('mini-play-btn').innerHTML = icon;
            document.getElementById('full-play-btn').innerHTML = icon;
        }

        audio.onended = () => {
            siguienteCancion();
        };

        function siguienteCancion() {
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= playlist.length) nextIndex = 0; 
            reproducirCancion(nextIndex);
        }

        function anteriorCancion() {
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = playlist.length - 1; 
            reproducirCancion(prevIndex);
        }

        // --- BARRA DE PROGRESO ---
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                totalTimeEl.innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                const seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- PANTALLA COMPLETA (MODAL) ---
        function abrirPantallaCompleta() {
            if (currentSongIndex === -1) return;
            document.getElementById('full-player').classList.add('active');
        }

        function cerrarPantallaCompleta() {
            document.getElementById('full-player').classList.remove('active');
        }

        // --- SISTEMA DE VOTOS (LIKE/DISLIKE) ---
        function votar(tipo) {
            if (currentSongIndex === -1) return;
            const cancionId = playlist[currentSongIndex].id;
            
            // CAMBIO: Si ya votó lo mismo, quitamos el voto. Si vota distinto, se reemplaza automáticamente.
            if (userVotes[cancionId] === tipo) {
                delete userVotes[cancionId];
            } else {
                userVotes[cancionId] = tipo;
            }

            localStorage.setItem('neon_votes', JSON.stringify(userVotes));
            
            aplicarAlgoritmoOrden();
            actualizarBotonesVoto(cancionId);
            
            // Renderizar todo de nuevo para actualizar el Home
            renderizarHome();
            renderizarLista(playlist, 'home-list');
            
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            if(searchVal) {
                const filtradas = playlist.filter(c => c.name.toLowerCase().includes(searchVal) || c.artist.toLowerCase().includes(searchVal));
                renderizarLista(filtradas, 'search-results');
            } else {
                renderizarLista(playlist, 'search-results');
            }
        }

        function actualizarBotonesVoto(cancionId) {
            const btnLike = document.getElementById('btn-like');
            const btnDislike = document.getElementById('btn-dislike');
            
            btnLike.className = 'feedback-btn';
            btnDislike.className = 'feedback-btn';

            if (userVotes[cancionId] === 'like') {
                btnLike.classList.add('active-like'); // CAMBIO: Aquí se aplica el brillo CSS
            } else if (userVotes[cancionId] === 'dislike') {
                btnDislike.classList.add('active-dislike');
            }
        }

        function aplicarAlgoritmoOrden() {
            const likes = playlist.filter(c => userVotes[c.id] === 'like');
            const neutrales = playlist.filter(c => !userVotes[c.id]);
            const dislikes = playlist.filter(c => userVotes[c.id] === 'dislike');

            playlist = [...likes, ...neutrales, ...dislikes];

            const nuevoOrdenIds = playlist.map(c => c.id);
            localStorage.setItem('neon_order', JSON.stringify(nuevoOrdenIds));
        }

        // --- ESTADÍSTICAS ---
        function guardarEstadisticaPlay(cancionId) { // CAMBIO: Recibe el ID
            let plays = parseInt(localStorage.getItem('neon_plays') || '0');
            localStorage.setItem('neon_plays', plays + 1);
            
            // Guardar en historial para Recomendados
            if (cancionId) {
                playHistory = playHistory.filter(id => id !== cancionId); // Remover si ya existía
                playHistory.unshift(cancionId); // Poner al inicio
                if (playHistory.length > 10) playHistory.pop(); // Limitar a 10
                localStorage.setItem('neon_history', JSON.stringify(playHistory));
                renderizarHome(); // Actualizar recomendados en tiempo real
            }

            const stringified = JSON.stringify(localStorage);
            const kb = (new Blob([stringified]).size / 1024).toFixed(2);
            localStorage.setItem('neon_cache_size', kb);
            
            actualizarEstadisticas();
        }

        function actualizarEstadisticas() {
            document.getElementById('stat-played').innerText = localStorage.getItem('neon_plays') || '0';
            document.getElementById('stat-cache').innerText = (localStorage.getItem('neon_cache_size') || '0') + ' KB';
        }
    </script>
</body>
</html>
