<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Music</title>
    <style>
        :root {
            --bg-color: #050505;
            --bg-card: #121212;
            --bg-brilloso: #1e1e1e;
            --neon-pink: #ff007f;
            --neon-pink-glow: rgba(255, 0, 127, 0.4);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-family); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
        .spinner { width: 60px; height: 60px; border: 4px solid var(--bg-brilloso); border-top: 4px solid var(--neon-pink); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-pink-glow); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-screen p { margin-top: 20px; color: var(--neon-pink); font-weight: bold; letter-spacing: 2px; }

        .view { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 160px; display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.5rem; margin-bottom: 15px; margin-top: 10px; }
        .section-title { display: flex; justify-content: space-between; align-items: center; }
        
        .song-list { display: flex; flex-direction: column; gap: 15px; }
        .song-card { display: flex; align-items: center; background-color: var(--bg-card); padding: 10px; border-radius: 12px; transition: background 0.2s, box-shadow 0.2s; cursor: pointer; border: 1px solid transparent; }
        .song-card:hover { background-color: var(--bg-brilloso); box-shadow: 0 0 10px var(--neon-pink-glow); border: 1px solid var(--neon-pink); }
        
        /* Cover por defecto con gradiente neón */
        .song-cover { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; background: linear-gradient(135deg, var(--neon-pink), #2a003f); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 0 10px var(--neon-pink-glow); flex-shrink: 0; }
        
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #player { position: fixed; bottom: 70px; left: 10px; right: 10px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); border-radius: 15px; padding: 10px 15px; display: none; align-items: center; border: 1px solid var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink-glow); z-index: 100; }
        #player.active { display: flex; }
        .player-cover { width: 40px; height: 40px; border-radius: 5px; margin-right: 10px; background: linear-gradient(135deg, var(--neon-pink), #2a003f); display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .player-controls { flex: 1; overflow: hidden; }
        .playing-title { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--neon-pink); }
        .playing-artist { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #audio-element { display: none; }
        .play-btn { background: var(--neon-pink); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--neon-pink-glow); flex-shrink: 0; }

        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background-color: var(--bg-card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--bg-brilloso); z-index: 101; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; cursor: pointer; transition: color 0.3s; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--neon-pink); filter: drop-shadow(0 0 5px var(--neon-pink-glow)); }

        .settings-container { background: var(--bg-card); border-radius: 15px; padding: 20px; border-left: 4px solid var(--neon-pink); box-shadow: -5px 0 15px var(--neon-pink-glow); animation: openBook 0.4s ease-out forwards; transform-origin: left center; }
        @keyframes openBook { from { transform: perspective(1000px) rotateY(-90deg); opacity: 0; } to { transform: perspective(1000px) rotateY(0deg); opacity: 1; } }
        .setting-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--bg-brilloso); }
        .setting-item:last-child { border-bottom: none; }
        .setting-value { color: var(--neon-pink); font-weight: bold; }

        .search-bar { display: flex; background: var(--bg-brilloso); border-radius: 25px; padding: 10px 20px; margin-bottom: 20px; border: 1px solid var(--neon-pink); }
        .search-bar input { flex: 1; background: none; border: none; color: white; font-size: 1rem; outline: none; }
        .search-bar button { background: none; border: none; color: var(--neon-pink); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>CARGANDO NEON...</p>
    </div>

    <div id="view-home" class="view active">
        <h2>Bienvenido</h2>
        <div class="section-title"><h2>Tu Playlist</h2></div>
        <div class="song-list" id="home-list"></div>
    </div>

    <div id="view-search" class="view">
        <h2>Buscar en tu Playlist</h2>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Filtrar por canción o artista...">
            <button id="search-btn">🔍</button>
        </div>
        <div class="song-list" id="search-results"></div>
    </div>

    <div id="view-settings" class="view">
        <h2>Configuración</h2>
        <div class="settings-container">
            <div class="setting-item"><span>Canciones escuchadas</span><span class="setting-value" id="stat-played">0</span></div>
            <div class="setting-item"><span>Almacenamiento en caché</span><span class="setting-value" id="stat-cache">0 KB</span></div>
            <div class="setting-item"><span>Versión</span><span class="setting-value">1.0.0 Neon (Local)</span></div>
        </div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top: 20px; background: transparent; color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer;">Borrar historial</button>
    </div>

    <div id="player">
        <div class="player-cover">🎵</div>
        <div class="player-controls">
            <div class="playing-title" id="player-title">Canción</div>
            <div class="playing-artist" id="player-artist">Artista</div>
        </div>
        <button class="play-btn" id="play-pause-btn">▶</button>
    </div>
    <audio id="audio-element"></audio>

    <div id="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Inicio
        </div>
        <div class="nav-item" onclick="switchTab('search')">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Buscar
        </div>
        <div class="nav-item" onclick="switchTab('settings')">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg> Ajustes
        </div>
    </div>

    <script>
        // --- TU PLAYLIST LOCAL ---
        const playlist = [
            { name: "Latin Lover", artist: "Neutro Shorty, Big Soto", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936364197.mpeg" },
            { name: "El La Engaño Lambada", artist: "Natusha", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936787983.mpeg" },
            { name: "Quédate", artist: "Belee", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936643238.mpeg" },
            { name: "Odisea", artist: "Ozuna", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775935979163.mpeg" },
            { name: "Maquiavélico", artist: "Cancerbero", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936827892.mpeg" },
            { name: "Eoo", artist: "Bad Bunny", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936322243.mpeg" },
            { name: "Los Viejos Me Llaman", artist: "No Name", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936897844.mpeg" },
            { name: "Ninfómana", artist: "Jossimar ft El Apóstol", url: "https://raw.githubusercontent.com/JTxs00/uploads/main/1775936920447.mpeg" }
        ];

        const audio = document.getElementById('audio-element');
        const player = document.getElementById('player');
        const playBtn = document.getElementById('play-pause-btn');
        
        let historial = JSON.parse(localStorage.getItem('neon_historial')) || [];

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            actualizarEstadisticas();
            
            // Mostramos la lista completa en Inicio
            renderizarLista(playlist, 'home-list');

            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            }, 1000); // 1 segundo para que se vea el spinner
        };

        // --- NAVEGACIÓN ---
        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`view-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tab === 'settings') actualizarEstadisticas();
            if(tab === 'search') {
                // Limpiamos la búsqueda al entrar
                document.getElementById('search-input').value = '';
                document.getElementById('search-results').innerHTML = '';
            }
        }

        // --- RENDERIZAR LISTA ---
        function renderizarLista(lista, contenedorId) {
            const container = document.getElementById(contenedorId);
            container.innerHTML = '';

            if(lista.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No se encontraron canciones.</p>';
                return;
            }

            lista.forEach(cancion => {
                const div = document.createElement('div');
                div.className = 'song-card';
                div.onclick = () => reproducir(cancion);
                
                // Usamos el gradiente en vez de foto
                div.innerHTML = `
                    <div class="song-cover">🎵</div>
                    <div class="song-info">
                        <div class="song-title">${cancion.name}</div>
                        <div class="song-artist">${cancion.artist}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- BUSCADOR LOCAL (Filtra tu array) ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtradas = playlist.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.artist.toLowerCase().includes(query)
            );
            renderizarLista(filtradas, 'search-results');
        });

        document.getElementById('search-btn').onclick = () => {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtradas = playlist.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.artist.toLowerCase().includes(query)
            );
            renderizarLista(filtradas, 'search-results');
        };

        // --- REPRODUCTOR ---
        function reproducir(cancion) {
            player.classList.add('active');
            document.getElementById('player-title').innerText = cancion.name;
            document.getElementById('player-artist').innerText = cancion.artist;
            
            playBtn.innerText = "⏳";

            // Como los enlaces son directos, solo asignamos y reproducimos
            audio.src = cancion.url;
            audio.play().then(() => {
                playBtn.innerText = "⏸";
                guardarEnHistorial(cancion);
                let plays = parseInt(localStorage.getItem('neon_plays') || '0');
                localStorage.setItem('neon_plays', plays + 1);
                actualizarEstadisticas();
            }).catch(error => {
                console.error(error);
                alert("Error al reproducir. Revisa que el enlace de GitHub sea válido.");
                playBtn.innerText = "▶";
            });

            playBtn.onclick = togglePlay;
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; } 
            else { audio.pause(); playBtn.innerText = "▶"; }
        }

        audio.onended = () => { playBtn.innerText = "▶"; };

        // --- HISTORIAL Y ESTADÍSTICAS ---
        function guardarEnHistorial(cancion) {
            if(historial.length > 0 && historial[historial.length - 1].url === cancion.url) return;

            historial.push(cancion);
            if (historial.length > 10) historial.shift();
            localStorage.setItem('neon_historial', JSON.stringify(historial));
            
            const stringified = JSON.stringify(localStorage);
            const kb = (new Blob([stringified]).size / 1024).toFixed(2);
            localStorage.setItem('neon_cache_size', kb);
        }

        function actualizarEstadisticas() {
            document.getElementById('stat-played').innerText = localStorage.getItem('neon_plays') || '0';
            document.getElementById('stat-cache').innerText = (localStorage.getItem('neon_cache_size') || '0') + ' KB';
        }
    </script>
</body>
</html>
